name: Refresh catalogue

# Fetches the most popular anime and manga from AniList on GitHub's servers and saves
# them as public/catalogue.json, so the app never downloads them on a phone.
# Runs monthly, whenever the fetching code changes, and on demand
# (Actions tab → Refresh catalogue → Run workflow).

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'
  push:
    branches: [main]
    paths:
      - scripts/build-catalogue.ts
      - src/anilist/catalogue.ts
      - src/anilist/client.ts
      - src/anilist/group.ts
      - src/anilist/catalogueFile.ts
      - src/types.ts

permissions:
  contents: write

concurrency:
  group: catalogue
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch from AniList (one retry after a pause)
        run: npx vite-node scripts/build-catalogue.ts || (sleep 180 && npx vite-node scripts/build-catalogue.ts)
      - name: Keep the raw AniList data on the raw-data branch, for offline checks of the grouping
        if: hashFiles('raw-media.json.gz') != ''
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir /tmp/raw && cp raw-media.json.gz /tmp/raw/ && cd /tmp/raw
          git init -q -b raw-data
          git add raw-media.json.gz
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Raw AniList data from the catalogue build"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" raw-data
      - name: Commit the new catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/catalogue.json
          if git diff --cached --quiet; then
            echo "Catalogue unchanged."
            exit 0
          fi
          git commit -m "Refresh the anime catalogue from AniList"
          git pull --rebase origin main
          git push origin HEAD:main
